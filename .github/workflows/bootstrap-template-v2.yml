name: Bootstrap template files

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template repo
        uses: actions/checkout@v4

      - name: Build template files
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/djmonnar/ryu-seongkuk/archive/refs/heads/codex/candidate-homepage-template.zip" -o /tmp/source.zip
          rm -rf /tmp/template-source
          mkdir -p /tmp/template-source
          unzip -q /tmp/source.zip -d /tmp/template-source
          SRC="$(find /tmp/template-source -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -R "$SRC/app" .
          cp -R "$SRC/components" .
          cp -R "$SRC/src" .
          cp -R "$SRC/types" .
          cp -R "$SRC/public" .
          cp "$SRC/.gitignore" .
          cp "$SRC/next-env.d.ts" .
          cp "$SRC/next.config.mjs" .
          cp "$SRC/package.json" .
          cp "$SRC/package-lock.json" .
          cp "$SRC/postcss.config.mjs" .
          cp "$SRC/tailwind.config.ts" .
          cp "$SRC/tsconfig.json" .
          cp "$SRC/README.md" .
          cp "$SRC/TEMPLATE_GUIDE.md" .

          rm -f public/CNAME CNAME
          rm -rf public/images
          mkdir -p public/images

          python - <<'PY'
          from pathlib import Path
          p = Path('src/data/candidate.ts')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'heroWide: "/images/hero-wide.png"': 'heroWide: "/images/hero-wide.svg"',
              'heroMobile: "/images/hero-mobile.png"': 'heroMobile: "/images/hero-mobile.svg"',
              'partySymbol: "/images/minjoo-symbol.svg"': 'partySymbol: "/images/party-symbol.svg"',
              'partyLogo: "/images/minjoo-logo.svg"': 'partyLogo: "/images/party-logo.svg"',
              'policyVisual: "/images/policy-education-visual.png"': 'policyVisual: "/images/policy-visual.svg"',
              'mapVisual: "/images/district-map-visual.png"': 'mapVisual: "/images/map-visual.svg"',
              'shareKakao: "/images/share-kakao.jpg"': 'shareKakao: "/images/share-kakao.svg"',
              'shareMessage: "/images/share-message.jpg"': 'shareMessage: "/images/share-message.svg"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          layout = Path('app/layout.tsx')
          s = layout.read_text(encoding='utf-8').replace('type: "image/jpeg"', 'type: "image/svg+xml"')
          layout.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          s = readme.read_text(encoding='utf-8').replace('대표 이미지와 공유 이미지', 'placeholder 이미지')
          readme.write_text(s, encoding='utf-8')

          guide = Path('TEMPLATE_GUIDE.md')
          s = guide.read_text(encoding='utf-8')
          s = s.replace('`public/images/`의 파일', '`public/images/`의 placeholder 파일')
          for old, new in {
              'hero-wide.png': 'hero-wide.svg',
              'hero-mobile.png': 'hero-mobile.svg',
              'policy-education-visual.png': 'policy-visual.svg',
              'district-map-visual.png': 'map-visual.svg',
              'share-kakao.jpg': 'share-kakao.svg',
              'share-message.jpg': 'share-message.svg',
          }.items():
              s = s.replace(old, new)
          guide.write_text(s, encoding='utf-8')
          PY

          cat > public/images/hero-wide.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset=".55" stop-color="#eaf5ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient></defs><rect width="1800" height="1100" fill="url(#bg)"/><path d="M0 760C260 690 420 805 650 735c250-76 360-292 660-270 200 15 330 130 490 95v540H0Z" fill="#fff" opacity=".88"/><circle cx="1250" cy="395" r="210" fill="#004ea2" opacity=".12"/><circle cx="1248" cy="330" r="88" fill="#004ea2"/><path d="M1065 720c34-150 120-238 185-238s151 88 185 238Z" fill="#004ea2"/><rect x="170" y="210" width="520" height="34" rx="17" fill="#004ea2" opacity=".18"/><rect x="170" y="280" width="660" height="64" rx="32" fill="#071f3f" opacity=".18"/></svg>
          SVG
          cat > public/images/hero-mobile.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400"><rect width="900" height="1400" fill="#eaf5ff"/><circle cx="450" cy="430" r="210" fill="#004ea2" opacity=".1"/><circle cx="450" cy="330" r="110" fill="#004ea2"/><path d="M220 850c45-220 150-350 230-350s185 130 230 350Z" fill="#004ea2"/><path d="M0 965c145-68 250-24 370-70 150-57 245-140 530-70v575H0Z" fill="#fff" opacity=".9"/></svg>
          SVG
          cat > public/images/party-symbol.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="44" fill="#004ea2"/><path d="M48 20l8.2 16.6 18.3 2.7-13.2 12.9 3.1 18.2L48 61.8 31.6 70.4l3.1-18.2-13.2-12.9 18.3-2.7Z" fill="#fff"/></svg>
          SVG
          cat > public/images/party-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96"><rect width="420" height="96" rx="48" fill="#004ea2"/><circle cx="50" cy="48" r="28" fill="#fff"/><rect x="96" y="32" width="245" height="14" rx="7" fill="#fff"/><rect x="96" y="54" width="170" height="10" rx="5" fill="#fff" opacity=".6"/></svg>
          SVG
          cat > public/images/policy-visual.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#eaf5ff"/><rect x="160" y="130" width="880" height="640" rx="34" fill="#fff"/><rect x="225" y="205" width="360" height="36" rx="18" fill="#004ea2" opacity=".22"/><rect x="225" y="285" width="720" height="24" rx="12" fill="#071f3f" opacity=".18"/></svg>
          SVG
          cat > public/images/map-visual.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" fill="#eaf5ff"/><path d="M0 470c190-70 330 20 500-45 185-70 270-220 520-170 150 30 245 130 380 95v300H0Z" fill="#fff"/><path d="M140 170c170 100 250 55 380 170s300 80 450 190" fill="none" stroke="#004ea2" stroke-width="16" stroke-linecap="round" opacity=".22"/><path d="M424 230c0-58 47-105 105-105s105 47 105 105c0 80-105 180-105 180S424 310 424 230Z" fill="#004ea2"/><circle cx="529" cy="230" r="34" fill="#fff"/></svg>
          SVG
          cat > public/images/share-kakao.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#004ea2"/><circle cx="920" cy="310" r="160" fill="#26a7df" opacity=".38"/><rect x="90" y="205" width="700" height="70" rx="35" fill="#fff"/><circle cx="920" cy="245" r="70" fill="#fff"/><path d="M770 500c28-110 90-175 150-175s122 65 150 175Z" fill="#fff"/></svg>
          SVG
          cat > public/images/share-message.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#071f3f"/><circle cx="540" cy="375" r="210" fill="#004ea2"/><circle cx="540" cy="300" r="92" fill="#fff"/><path d="M350 640c38-150 115-230 190-230s152 80 190 230Z" fill="#fff"/><rect x="150" y="760" width="780" height="50" rx="25" fill="#26a7df"/></svg>
          SVG

      - name: Commit template files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initialize candidate homepage template"
          git push
